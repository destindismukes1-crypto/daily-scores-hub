name: Rename temporary upload to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move temporary upload to index.html
        run: |
          mv daily-scores-hub.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish newest PayPal-free SCOREZONE build as index.html" || echo "No changes to commit"
          git push
