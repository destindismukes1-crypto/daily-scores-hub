name: Rename to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename temporary build to index.html
        run: mv daily-scores-hub.html index.html
      - name: Commit and push renamed file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace index.html with current SCOREZONE build via rename workflow" || echo "No changes to commit"
          git push
