name: Rename to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git mv daily-scores-hub.html index.html
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git commit -m "Rename daily-scores-hub.html to index.html"
          git push
